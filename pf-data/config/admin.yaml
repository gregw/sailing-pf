# IMPORTANT: This file is managed by the server.
# It is overwritten whenever settings are saved via the admin UI.
# Only edit manually when the server is NOT running.

# --- Server Import and Analysis tasks ---
importers:
- name: "orc-api"
  mode: "api"
  includeInSchedule: true
  runAtStartup: false
- name: "ams"
  mode: "api"
  includeInSchedule: true
  runAtStartup: false
- name: "bwps"
  mode: "api"
  includeInSchedule: true
  runAtStartup: false
- name: "topyacht"
  mode: "api"
  includeInSchedule: true
  runAtStartup: false
- name: "sailsys"
  mode: "api"
  includeInSchedule: true
  runAtStartup: false
- name: "build-indexes"
  mode: "run"
  includeInSchedule: true
  runAtStartup: true
- name: "analysis"
  mode: "run"
  includeInSchedule: true
  runAtStartup: true
- name: "reference-factors"
  mode: "run"
  includeInSchedule: true
  runAtStartup: true
- name: "pf-optimise"
  mode: "run"
  includeInSchedule: true
  runAtStartup: true
- name: "save-database"
  mode: "run"
  includeInSchedule: true
  runAtStartup: true
- name: "clear-cache-orc"
  mode: "run"
  includeInSchedule: false
  runAtStartup: false
- name: "clear-cache-sailsys"
  mode: "run"
  includeInSchedule: false
  runAtStartup: false
- name: "myc-archive"
  mode: "run"
  includeInSchedule: false
  runAtStartup: false
- name: "bwps"
  mode: "history"
  includeInSchedule: false
  runAtStartup: false
- name: "pf-history"
  mode: "run"
  includeInSchedule: false
  runAtStartup: false
schedule:
  days:
  - "MONDAY"
  - "WEDNESDAY"
  - "SATURDAY"
  - "SUNDAY"
  time: "02:00:00"
targetIrcYear: 2026
outlierSigma: null
recentRaceReimportDays: 30

# --- SailSys importer ---
sailsysYoungCacheMaxAgeDays: 7
sailsysOldCacheMaxAgeDays: 352
sailsysYoungRaceMaxAgeDays: 365
sailsysHttpDelayMs: 200
sailsysRecentRaceDays: 14

# --- BWPS importer ---
bwpsMinYear: 2021

# --- ORC importer ---
orcListMaxAgeDays: 1

# --- Analysis ---
minAnalysisR2: 0.5
minAnalysisPairs: 8
clubCertificateWeight: 0.9

# --- PF optimiser ---
pfLambda: 2.0
pfOutlierK: 2.2
pfAsymmetryFactor: 1.5
pfOuterDampingFactor: 0.15
pfOuterConvergenceThreshold: 0.03
pfConvergenceThreshold: 0.06
pfMaxInnerIterations: 100
pfMaxOuterIterations: 40
pfCrossVariantLambda: 2.0
pfGraphCrossVariantLambda: 0.5
pfNoRaceFallbackWeight: 0.2
pfOuterPfConvergenceThreshold: 0.006
pfLogOuterDiagnostics: false
pfDubiousFactor: 1.7
pfMaxFactor: 2.5
pfAgeHalfLifeYears: 2.0
pfVariantOrderLambda: 8.0

# --- Sliding average / consistency ---
slidingAverageCount: 8
slidingAverageDrops: 1

# --- Diversity weights (multi-variant PF) ---
diversityNonSpinWeight: 0.8
diversitySpinWeight: 1.0
diversityTwoHandedWeight: 1.2
consistencyDropInterval: 11

# --- Server ports ---
adminPort: 8888
userPort: 8081
natGatewayIp: null
