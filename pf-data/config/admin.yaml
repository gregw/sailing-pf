# IMPORTANT: This file is managed by the server.
# It is overwritten whenever settings are saved via the admin UI.
# Only edit manually when the server is NOT running.

# --- Server Import and Analysis tasks ---
importers:
- name: "orc"
  mode: "api"
  includeInSchedule: false
  runAtStartup: false
- name: "ams"
  mode: "api"
  includeInSchedule: false
  runAtStartup: false
- name: "bwps"
  mode: "api"
  includeInSchedule: false
  runAtStartup: false
- name: "sailsys-races"
  mode: "run"
  includeInSchedule: true
  runAtStartup: false
- name: "topyacht"
  mode: "api"
  includeInSchedule: true
  runAtStartup: false
- name: "build-indexes"
  mode: "run"
  includeInSchedule: true
  runAtStartup: true
- name: "analysis"
  mode: "run"
  includeInSchedule: true
  runAtStartup: true
- name: "reference-factors"
  mode: "run"
  includeInSchedule: true
  runAtStartup: true
- name: "pf-optimise"
  mode: "run"
  includeInSchedule: true
  runAtStartup: true
- name: "save-database"
  mode: "run"
  includeInSchedule: true
  runAtStartup: true
schedule:
  days:
  - "MONDAY"
  - "WEDNESDAY"
  - "SATURDAY"
  - "SUNDAY"
  time: "02:00:00"
targetIrcYear: 2025
outlierSigma: null
recentRaceReimportDays: 30

# --- SailSys importer ---
sailsysNextRaceId: 33047
sailsysEndRaceId: 41410
sailsysYoungCacheMaxAgeDays: 7
sailsysOldCacheMaxAgeDays: 352
sailsysYoungRaceMaxAgeDays: 365
sailsysHttpDelayMs: 200
sailsysRecentRaceDays: 14

# --- BWPS importer ---
bwpsMinYear: 2021

# --- ORC importer ---
orcListMaxAgeDays: 1

# --- Analysis ---
minAnalysisR2: 0.5
minAnalysisPairs: 8
clubCertificateWeight: 0.9

# --- PF optimiser ---
pfLambda: 1.0
pfOutlierK: 1.5
pfAsymmetryFactor: 1.75
pfOuterDampingFactor: 0.075
pfOuterConvergenceThreshold: 0.001
pfConvergenceThreshold: 0.06
pfMaxInnerIterations: 100
pfMaxOuterIterations: 50
pfCrossVariantLambda: 0.0
pfGraphCrossVariantLambda: 0.25
pfNoRaceFallbackWeight: 0.2
pfOuterPfConvergenceThreshold: 0.001
pfLogOuterDiagnostics: true

# --- Sliding average / consistency ---
slidingAverageCount: 8
slidingAverageDrops: 1

# --- Diversity weights (multi-variant PF) ---
diversityNonSpinWeight: 0.8
diversitySpinWeight: 1.0
diversityTwoHandedWeight: 1.2
consistencyDropInterval: 11

# --- Authentication ---
googleClientId: null
googleClientSecret: null
authBaseUrl: null
authAllowedDomain: null

# --- Server ports ---
adminPort: 8888
userPort: 8080
natGatewayIp: "10.19.25.1"
