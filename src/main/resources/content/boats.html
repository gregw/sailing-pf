<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PF — Boats</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- INCLUDE _nav.html -->

<div id="import-banner" class="import-warning-banner" style="display:none">
    Data import/analysis in progress — results may be incomplete or stale
</div>

<div id="panel-boats" class="tab-panel active">
    <div id="filter-banner-boats" class="filter-banner" style="display:none"></div>
    <div class="search-row">
        <input type="text" id="q-boats" placeholder="Search by id or name…" oninput="debounceSearch('boats')">
        <button class="search-clear-btn" title="Clear search" onclick="clearSearch('boats')">✕</button>
        <button onclick="doSearch('boats')">Search</button>
        <label style="margin-left:0.5rem;">Duplicates: <select id="filter-dupes" onchange="doSearch('boats')">
            <option value="">(none)</option>
            <option value="sail">Sail #</option>
            <option value="sailName">Sail # + name (diff design)</option>
            <option value="sailDesign">Sail # + design (diff name)</option>
            <option value="sailDesignName">Sail # + design + similar name</option>
        </select></label>
        <label style="margin-left:0.5rem;"><input type="checkbox" id="show-excluded-boats" onchange="doSearch('boats')"> Show
            excluded</label>
        <label style="margin-left:0.5rem;">Variant: <select id="boat-variant" onchange="setBoatVariant(this.value)">
            <option value="spin">Spin</option>
            <option value="nonSpin">Non-spin</option>
            <option value="twoHanded">Two-handed</option>
        </select></label>
        <label style="margin-left:0.5rem;"><input type="checkbox" id="hide-empty-boats" onchange="doSearch('boats')"> Hide empty</label>
    </div>
    <div class="table-scroll" style="height:calc(75vh - 300px);max-height:calc(100vh - 250px);overflow-y:auto;resize:vertical;">
        <table>
            <thead>
            <tr id="thead-boats"></tr>
            </thead>
            <tbody id="tbody-boats"></tbody>
        </table>
    </div>
    <div class="scroll-status" id="scroll-status-boats"></div>
    <div id="json-raw-boats"></div>

    <div id="merge-bar-boats" style="display:none; margin-top:0.75rem; padding:0.6rem 0.8rem; background:#fff8e1; border:1px solid #f0c040; border-radius:4px;">
        <span id="merge-bar-count-boats"></span>
        <button id="edit-btn-boats" onclick="showEditPanel()" style="margin-left:0.5rem;display:none;">Edit…</button>
        <button id="edit-request-btn-boats" onclick="showEditPanel()" style="margin-left:0.5rem;display:none;">Request edit…
        </button>
        <button id="edit-club-btn-boats" onclick="showBoatClubPanel()" style="margin-left:0.5rem;display:none;">Edit Club…
        </button>
        <button id="edit-club-request-btn-boats" onclick="showBoatClubPanel()" style="margin-left:0.5rem;display:none;">Request
            Club edit…
        </button>
        <button id="merge-btn-boats" onclick="showMergePanel('boats')" style="margin-left:0.5rem;">Merge…</button>
        <button id="merge-request-btn-boats" onclick="showMergePanel('boats')" style="margin-left:0.5rem;display:none;">Request
            merge…
        </button>
        <button id="exclude-btn-boats" onclick="showExcludePanel('boats', true)" style="margin-left:0.5rem;display:none;">
            Exclude…
        </button>
        <button id="include-btn-boats" onclick="showExcludePanel('boats', false)" style="margin-left:0.5rem;display:none;">
            Include…
        </button>
        <button id="dubious-btn-boats" onclick="showDubiousPanel('boats')" style="margin-left:0.5rem;display:none;">Flag as
            dubious…
        </button>
        <button onclick="clearSelection('boats')" style="margin-left:0.5rem;">Clear selection</button>
    </div>

    <div id="dubious-panel-boats" style="display:none; margin-top:0.75rem; padding:0.8rem; border:1px solid #ccc; border-radius:4px; background:#fafafa;">
        <strong id="dubious-panel-title-boats"></strong>
        <div id="dubious-list-boats" style="margin:0.6rem 0;"></div>
        <div style="margin-bottom:0.5rem;">
            <label for="dubious-message-boats" style="font-size:0.9rem;">Why is this dubious? (optional):</label><br>
            <textarea id="dubious-message-boats" rows="2" style="width:100%;max-width:400px;padding:3px 6px;font-size:0.9rem;" placeholder="Reason…"></textarea>
        </div>
        <div style="margin-bottom:0.5rem;">
            <label for="dubious-email-boats" style="font-size:0.9rem;">Your email (optional): </label>
            <input type="email" id="dubious-email-boats" placeholder="you@example.com" style="padding:3px 6px;" oninput="syncRequestEmail(this.value)">
        </div>
        <button id="dubious-submit-boats" onclick="submitDubious('boats')">Submit</button>
        <button onclick="hideDubiousPanel('boats')" style="margin-left:0.5rem;">Cancel</button>
        <div id="dubious-status-boats" style="margin-top:0.5rem; color:#555;"></div>
    </div>

    <div id="exclude-panel-boats" style="display:none; margin-top:0.75rem; padding:0.8rem; border:1px solid #ccc; border-radius:4px; background:#fafafa;">
        <strong id="exclude-panel-title-boats"></strong>
        <div id="exclude-list-boats" style="margin:0.6rem 0;"></div>
        <div id="exclude-email-row-boats" style="display:none; margin-bottom:0.5rem;">
            <label for="exclude-email-boats" style="font-size:0.9rem;">Your email (optional): </label>
            <input type="email" id="exclude-email-boats" placeholder="you@example.com" style="padding:3px 6px;" oninput="syncRequestEmail(this.value)">
        </div>
        <div id="exclude-message-row-boats" style="display:none; margin-bottom:0.5rem;">
            <label for="exclude-message-boats" style="font-size:0.9rem;">Reason (optional):</label><br>
            <textarea id="exclude-message-boats" rows="2" style="width:100%;max-width:400px;padding:3px 6px;font-size:0.9rem;" placeholder="Reason…"></textarea>
        </div>
        <button id="exclude-confirm-boats" onclick="performExclude('boats')">Confirm</button>
        <button id="exclude-request-confirm-boats" onclick="requestExclude('boats')" style="display:none;">Submit request
        </button>
        <button onclick="hideExcludePanel('boats')" style="margin-left:0.5rem;">Cancel</button>
        <div id="exclude-status-boats" style="margin-top:0.5rem; color:#555;"></div>
    </div>

    <div id="merge-panel-boats" style="display:none; margin-top:0.75rem; padding:0.8rem; border:1px solid #ccc; border-radius:4px; background:#fafafa;">
        <strong>Select the canonical boat to keep:</strong>
        <div id="merge-radio-list-boats" style="margin:0.6rem 0;"></div>
        <div id="merge-email-row-boats" style="display:none; margin-bottom:0.5rem;">
            <label for="merge-email-boats" style="font-size:0.9rem;">Your email (optional): </label>
            <input type="email" id="merge-email-boats" placeholder="you@example.com" style="padding:3px 6px;" oninput="syncRequestEmail(this.value)">
        </div>
        <div id="merge-message-row-boats" style="display:none; margin-bottom:0.5rem;">
            <label for="merge-message-boats" style="font-size:0.9rem;">Message (optional):</label><br>
            <textarea id="merge-message-boats" rows="2" style="width:100%;max-width:400px;padding:3px 6px;font-size:0.9rem;" placeholder="Reason for merge…"></textarea>
        </div>
        <button id="merge-confirm-boats" onclick="performMerge('boats')">Confirm merge</button>
        <button id="merge-request-confirm-boats" onclick="requestMerge('boats')" style="display:none;">Request merge</button>
        <button onclick="hideMergePanel('boats')" style="margin-left:0.5rem;">Cancel</button>
        <div id="merge-status-boats" style="margin-top:0.5rem; color:#555;"></div>
    </div>

    <div id="edit-panel-boats" style="display:none; margin-top:0.75rem; padding:0.8rem; border:1px solid #ccc; border-radius:4px; background:#fafafa;">
        <strong id="edit-panel-title">Edit Boat</strong>
        <div style="display:grid;grid-template-columns:auto 1fr;gap:0.3rem 0.8rem;max-width:500px;margin:0.5rem 0;">
            <label for="edit-boat-sail">Sail #:</label>
            <input type="text" id="edit-boat-sail" style="font-family:monospace;padding:3px 6px;">
            <label for="edit-boat-name">Name:</label>
            <input type="text" id="edit-boat-name" style="font-family:monospace;padding:3px 6px;">
            <label for="edit-boat-design">Design:</label>
            <select id="edit-boat-design" style="font-family:monospace;padding:3px 6px;"></select>
            <label style="align-self:start;padding-top:4px;">Clubs:</label>
            <div id="edit-boat-clubs" style="display:flex;flex-direction:column;gap:0.25rem;">
                <div id="edit-boat-clubs-list" style="display:flex;flex-direction:column;gap:0.2rem;"></div>
                <div style="display:flex;gap:0.3rem;align-items:center;">
                    <select id="edit-boat-club-add" style="font-family:monospace;padding:3px 6px;"></select>
                    <button type="button" onclick="addBoatClub()">Add</button>
                </div>
            </div>
        </div>
        <div id="edit-email-row" style="display:none; margin-bottom:0.5rem;">
            <label for="edit-email" style="font-size:0.9rem;">Your email (optional): </label>
            <input type="email" id="edit-email" placeholder="you@example.com" style="padding:3px 6px;" oninput="syncRequestEmail(this.value)">
        </div>
        <div id="edit-message-row" style="display:none; margin-bottom:0.5rem;">
            <label for="edit-message" style="font-size:0.9rem;">Message (optional):</label><br>
            <textarea id="edit-message" rows="2" style="width:100%;max-width:400px;padding:3px 6px;font-size:0.9rem;" placeholder="Reason for edit…"></textarea>
        </div>
        <button id="edit-save-btn" onclick="saveBoatEdit()">Save</button>
        <button id="edit-request-btn" onclick="requestBoatEdit()" style="display:none;">Request</button>
        <button onclick="hideEditPanel()" style="margin-left:0.5rem;">Cancel</button>
        <div id="edit-status-boats" style="margin-top:0.5rem; color:#555;"></div>
    </div>

    <div id="edit-club-panel-boats" style="display:none; margin-top:0.75rem; padding:0.8rem; border:1px solid #ccc; border-radius:4px; background:#fafafa;">
        <strong id="edit-club-panel-title">Edit Club for selected boats</strong>
        <div style="margin:0.5rem 0;">
            <label for="edit-club-select">Club:</label>
            <select id="edit-club-select" style="font-family:monospace;padding:3px 6px;margin-left:0.5rem;"></select>
        </div>
        <div id="edit-club-email-row" style="display:none; margin-bottom:0.5rem;">
            <label for="edit-club-email" style="font-size:0.9rem;">Your email (optional): </label>
            <input type="email" id="edit-club-email" placeholder="you@example.com" style="padding:3px 6px;" oninput="syncRequestEmail(this.value)">
        </div>
        <div id="edit-club-message-row" style="display:none; margin-bottom:0.5rem;">
            <label for="edit-club-message" style="font-size:0.9rem;">Message (optional):</label><br>
            <textarea id="edit-club-message" rows="2" style="width:100%;max-width:400px;padding:3px 6px;font-size:0.9rem;" placeholder="Reason for edit…"></textarea>
        </div>
        <button id="edit-club-save-btn" onclick="saveBoatClubBulk()">Save</button>
        <button id="edit-club-request-save-btn" onclick="requestBoatClubBulk()" style="display:none;">Request</button>
        <button onclick="hideBoatClubPanel()" style="margin-left:0.5rem;">Cancel</button>
        <div id="edit-club-status" style="margin-top:0.5rem; color:#555;"></div>
    </div>

    <div class="detail-panel" id="detail-boats">
        <div id="ref-factors-boats" style="margin-bottom:0.75rem;"></div>
        <div id="pf-detail-boats" style="margin-bottom:0.75rem;"></div>
        <div id="aliases-boats" style="margin-bottom:0.75rem;"></div>
    </div>
</div>

<script>window.PF_ENTITY = 'boats';</script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<script src="common.js"></script>
<script src="handicap-calc.js"></script>
<script src="data.js"></script>
</body>
</html>
