<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PF — Clubs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- INCLUDE _nav.html -->

<div id="import-banner" class="import-warning-banner" style="display:none">
    Data import/analysis in progress — results may be incomplete or stale
</div>

<div id="panel-clubs" class="tab-panel active">
    <div id="filter-banner-clubs" class="filter-banner" style="display:none"></div>
    <div class="search-row">
        <input type="text" id="q-clubs" placeholder="Search by id, short name or long name…" oninput="debounceSearch('clubs')">
        <button class="search-clear-btn" title="Clear search" onclick="clearSearch('clubs')">✕</button>
        <button onclick="doSearch('clubs')">Search</button>
        <label style="margin-left:0.5rem;"><input type="checkbox" id="show-excluded-clubs" onchange="doSearch('clubs')"> Show
            excluded</label>
        <label style="margin-left:0.5rem;"><input type="checkbox" id="hide-empty-clubs" onchange="doSearch('clubs')"> Hide empty</label>
        <button id="copy-emails-btn" style="display:none;margin-left:0.5rem;" onclick="copyClubEmails()" title="Copy email addresses of selected clubs (or all visible) to clipboard">
            Copy emails
        </button>
    </div>
    <div class="table-scroll" style="height:calc(55vh - 300px);max-height:calc(100vh - 250px);overflow-y:auto;resize:vertical;">
        <table>
            <thead>
            <tr id="thead-clubs"></tr>
            </thead>
            <tbody id="tbody-clubs"></tbody>
        </table>
    </div>
    <div class="scroll-status" id="scroll-status-clubs"></div>

    <div id="merge-bar-clubs" style="display:none; margin-top:0.75rem; padding:0.6rem 0.8rem; background:#fff8e1; border:1px solid #f0c040; border-radius:4px;">
        <span id="merge-bar-count-clubs"></span>
        <button id="edit-btn-clubs" onclick="showEditClubPanel()" style="margin-left:0.5rem;display:none;">Edit…</button>
        <button id="edit-request-btn-clubs" onclick="showEditClubPanel()" style="margin-left:0.5rem;display:none;">Request
            edit…
        </button>
        <button id="exclude-btn-clubs" onclick="showExcludePanel('clubs', true)" style="margin-left:0.5rem;display:none;">
            Exclude…
        </button>
        <button id="include-btn-clubs" onclick="showExcludePanel('clubs', false)" style="margin-left:0.5rem;display:none;">
            Include…
        </button>
        <button onclick="clearSelection('clubs')" style="margin-left:0.5rem;">Clear selection</button>
    </div>

    <div id="edit-panel-clubs" style="display:none; margin-top:0.75rem; padding:0.8rem; border:1px solid #ccc; border-radius:4px; background:#fafafa;">
        <strong id="edit-panel-title-clubs">Edit Club</strong>
        <div style="display:grid;grid-template-columns:auto 1fr;gap:0.3rem 0.8rem;max-width:500px;margin:0.5rem 0;">
            <label for="edit-club-short-name">Short name:</label>
            <input type="text" id="edit-club-short-name" style="padding:3px 6px;">
            <label for="edit-club-long-name">Full name:</label>
            <input type="text" id="edit-club-long-name" style="padding:3px 6px;">
            <label for="edit-club-state">State:</label>
            <input type="text" id="edit-club-state" style="padding:3px 6px; max-width:80px;">
            <label for="edit-club-email">Email:</label>
            <input type="email" id="edit-club-email" style="padding:3px 6px;">
        </div>
        <div id="edit-club-email-row" style="display:none; margin-bottom:0.5rem;">
            <label for="edit-request-email-clubs" style="font-size:0.9rem;">Your email (optional): </label>
            <input type="email" id="edit-request-email-clubs" placeholder="you@example.com" style="padding:3px 6px;" oninput="syncRequestEmail(this.value)">
        </div>
        <div id="edit-club-message-row" style="display:none; margin-bottom:0.5rem;">
            <label for="edit-club-message" style="font-size:0.9rem;">Message (optional):</label><br>
            <textarea id="edit-club-message" rows="2" style="width:100%;max-width:400px;padding:3px 6px;font-size:0.9rem;" placeholder="Reason for edit…"></textarea>
        </div>
        <button id="edit-club-save-btn" onclick="saveClubEdit()">Save</button>
        <button id="edit-club-request-btn" onclick="requestClubEdit()" style="display:none;">Request</button>
        <button onclick="hideEditClubPanel()" style="margin-left:0.5rem;">Cancel</button>
        <div id="edit-status-clubs" style="margin-top:0.5rem; color:#555;"></div>
    </div>

    <div id="exclude-panel-clubs" style="display:none; margin-top:0.75rem; padding:0.8rem; border:1px solid #ccc; border-radius:4px; background:#fafafa;">
        <strong id="exclude-panel-title-clubs"></strong>
        <div id="exclude-list-clubs" style="margin:0.6rem 0;"></div>
        <div id="exclude-email-row-clubs" style="display:none; margin-bottom:0.5rem;">
            <label for="exclude-email-clubs" style="font-size:0.9rem;">Your email (optional): </label>
            <input type="email" id="exclude-email-clubs" placeholder="you@example.com" style="padding:3px 6px;" oninput="syncRequestEmail(this.value)">
        </div>
        <div id="exclude-message-row-clubs" style="display:none; margin-bottom:0.5rem;">
            <label for="exclude-message-clubs" style="font-size:0.9rem;">Message (optional):</label><br>
            <textarea id="exclude-message-clubs" rows="2" style="width:100%;max-width:400px;padding:3px 6px;font-size:0.9rem;" placeholder="Reason…"></textarea>
        </div>
        <button id="exclude-confirm-clubs" onclick="performExclude('clubs')">Confirm</button>
        <button id="exclude-request-confirm-clubs" onclick="requestExclude('clubs')" style="display:none;">Submit request
        </button>
        <button onclick="hideExcludePanel('clubs')" style="margin-left:0.5rem;">Cancel</button>
        <div id="exclude-status-clubs" style="margin-top:0.5rem; color:#555;"></div>
    </div>

</div>

<script>window.PF_ENTITY = 'clubs';</script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<script src="common.js"></script>
<script src="handicap-calc.js"></script>
<script src="data.js"></script>
</body>
</html>
