<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PF — Boat Comparison</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
<!-- INCLUDE _nav.html -->

  <div id="import-banner" class="import-warning-banner" style="display:none">
      Data import/analysis in progress — results may be incomplete or stale
  </div>

  <div class="comparison-controls">
    <div class="selector-panels">
      <div class="selector-panel">
        <h3>Boats</h3>
        <input type="text" id="boat-search" class="selector-search" placeholder="Search by name or sail number…"
               title="Search boats by name, sail number, or ID">
        <div id="boat-list" class="selector-list"></div>
        <button id="add-boat-btn" disabled>Add Boat</button>
      </div>
    </div>
    <div class="comparison-options-row">
      <label class="all-available-label">
        <input type="checkbox" id="all-available"
               title="When unchecked, selectors only show boats/designs that have raced with every boat in the comparison list">
        All available
        <span style="color:#666;font-size:0.85rem;">(uncheck to show only boats that have raced with all comparison boats)</span>
      </label>
      <label title="Show RF (Reference Factor) horizontal line per boat">
        <input type="checkbox" id="show-rf-line" checked> RF line
      </label>
      <label title="Show PF (Performance Factor) horizontal line per boat">
        <input type="checkbox" id="show-pf-line" checked> PF line
      </label>
      <label title="Show weighted linear trend line per boat">
        <input type="checkbox" id="show-trend-linear" checked> Linear trend
      </label>
      <label title="Show trailing N-finish weighted average per boat">
        <input type="checkbox" id="show-trend-sliding" checked> Sliding average
      </label>
      <label title="Hide the chart legend">
        <input type="checkbox" id="hide-legend"> Hide legend
      </label>
        <label title="Limit chart to race results within the selected time window">
            <select id="recent-months">
                <option value="0">All time</option>
                <option value="6">Last 6 months</option>
                <option value="12">Last 12 months</option>
                <option value="18">Last 18 months</option>
                <option value="24">Last 24 months</option>
                <option value="60">Last 60 months</option>
            </select>
      </label>
      <label title="Only plot races in which all selected boats competed">
        <input type="checkbox" id="common-races-only"> Common races only
      </label>
        <label title="Start Y axis at 0">
            <input type="checkbox" id="bcfc-y-from-zero"> From 0.0000
        </label>
    </div>
  </div>

  <div id="chip-list" class="chip-list"></div>

<div id="comparison-chart-section">
<div style="font-weight:bold;margin-bottom:0.25rem;">Back Calculated Factor Comparison
    <a href="ui-tips.md#chart-comparison" class="info-btn" data-tip="Scatter plot of back-calculated factor per race over time for each comparison boat. Each dot is one race result; hover for details. Click a dot to show that race's division chart below." target="_blank">ⓘ</a>
</div>
<div id="comparison-chart" class="chart-tall" style="width:100%;height:670px;margin-top:0.5rem;"></div>
</div>

<div id="bcfc-race-division-section" style="display:none; margin-top:1rem;">
    <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.25rem;">
        <button id="bcfc-div-prev-btn" disabled onclick="inlineDivPrev()">← Prev race</button>
        <span style="font-weight:bold;" id="bcfc-race-division-title"></span>
        <button id="bcfc-div-next-btn" disabled onclick="inlineDivNext()">Next race →</button>
    </div>
    <div style="display:flex;gap:1rem;align-items:center;margin-bottom:0.25rem;font-size:0.9rem;">
        <label>X-axis: <select id="bcfc-div-xfactor" onchange="onInlineDivXFactorChange()"></select></label>
        <label title="Show the Elapsed time line in the chart">
            <input type="checkbox" id="bcfc-show-elapsed" onchange="onInlineShowElapsedChange(this)"> Elapsed
        </label>
    </div>
    <div id="bcfc-race-division-chart" style="width:100%;height:500px;"></div>
</div>

  <div id="pf-calc" style="display:none; margin-top:1.25rem;">
      <div id="pf-calc-table-section">
    <h3 style="margin:0 0 0.5rem;">Handicap Calculator <a href="ui-tips.md#table-pf-calc" class="info-btn" data-tip="Enter a handicap for any boat — PF, RF, and Best Fit columns for all boats are scaled by ratio. Each column uses its own per-boat ratio. Best Fit uses the latest point on the weighted linear trend through back-calculated factors." target="_blank">ⓘ</a></h3>
    <p style="margin:0 0 0.5rem;color:#666;font-size:0.85rem;">
      Enter a handicap for any boat — all three columns are scaled accordingly.
    </p>
    <table class="pf-calc-table"></table>
          <div style="margin-top:0.5rem;">
              <button id="use-pf-btn" style="padding:4px 12px;" title="Fill empty entries in the focused set with the displayed PF value">
                  Use PF
              </button>
              <button id="use-rf-btn" style="margin-left:0.5rem;padding:4px 12px;" title="Fill empty entries in the focused set with the displayed RF value">
                  Use RF
              </button>
          </div>
      </div>
      <div id="fetch-handicaps-form" style="margin-top:1rem;padding:0.8rem;border:1px solid #ddd;border-radius:4px;background:#f9f9f9;">
          <div style="margin-bottom:0.8rem;">
              <label for="handicap-url">Fetch handicaps from:</label>
              <input type="url" id="handicap-url" placeholder="https://example.com/handicaps.json" style="margin-left:0.5rem;width:400px;padding:4px;">
              <button id="fetch-handicaps-btn" style="margin-left:0.5rem;padding:4px 12px;">Fetch</button>
              <div id="fetch-status" style="margin-top:0.5rem;color:#666;font-size:0.9rem;"></div>
          </div>
          <div style="border-top:1px solid #ddd;margin:0.8rem 0;"></div>
          <div style="margin-bottom:0.8rem;">
              <label for="handicap-file">Load handicaps from file:</label>
              <input type="file" id="handicap-file" accept=".json" style="margin-left:0.5rem;">
              <div id="file-status" style="margin-top:0.5rem;color:#666;font-size:0.9rem;"></div>
          </div>
          <div style="border-top:1px solid #ddd;margin:0.8rem 0;"></div>
          <div style="margin-bottom:0.8rem;">
              <label for="handicap-variant-mode">On import:</label>
              <select id="handicap-variant-mode" style="margin-left:0.5rem;" title="How to handle Spin/NS/2H variant info in fetched handicaps">
                  <option value="ignore">Ignore variant</option>
                  <option value="set">Set selectors</option>
                  <option value="filter" selected>Filter by selector</option>
              </select>
              <label for="handicap-source-variant" style="margin-left:1rem;">Source variant:</label>
              <select id="handicap-source-variant" style="margin-left:0.5rem;" title="Override the variant of the imported handicaps (useful when the source doesn't label spin/NS)">
                  <option value="auto" selected>Auto-detect</option>
                  <option value="spin">Spin</option>
                  <option value="nonSpin">Non-Spin</option>
                  <option value="twoHanded">Two-Handed</option>
              </select>
          </div>
          <div style="border-top:1px solid #ddd;margin:0.8rem 0;"></div>
          <div>
              <button id="download-handicaps-btn" style="padding:4px 12px;">Download handicaps as JSON</button>
              <button id="clear-handicaps-btn" style="margin-left:0.5rem;padding:4px 12px;">Clear all</button>
              <div id="download-status" style="margin-top:0.5rem;color:#666;font-size:0.9rem;"></div>
          </div>
      </div>
  </div>

  <div id="elapsed-charts-section" style="display:none; margin-top:1.5rem;">
    <h3 style="margin:0 0 0.5rem;">Elapsed Time Comparison</h3>
    <div style="display:flex;gap:1.5rem;align-items:center;margin:0 0 0.5rem 0;font-size:0.9rem;">
      <label title="Start both axes at zero">
        <input type="checkbox" id="elapsed-from-zero" checked onchange="onElapsedFromZeroChange()"> From 0
      </label>
    </div>
    <div id="elapsed-charts-container"></div>
  </div>


  <script src="common.js"></script>
<script src="handicap-calc.js"></script>
  <script src="comparison.js"></script>
</body>
</html>
