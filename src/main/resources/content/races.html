<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PF — Races</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- INCLUDE _nav.html -->

<div id="import-banner" class="import-warning-banner" style="display:none">
    Data import/analysis in progress — results may be incomplete or stale
</div>

<div id="panel-races" class="tab-panel active">
    <div id="filter-banner-races" class="filter-banner" style="display:none"></div>
    <div class="search-row">
        <input type="text" id="q-races" placeholder="Search by id, series or race name…" oninput="debounceSearch('races')">
        <button class="search-clear-btn" title="Clear search" onclick="clearSearch('races')">✕</button>
        <button onclick="doSearch('races')">Search</button>
        <label style="margin-left:0.5rem;"><input type="checkbox" id="show-excluded-races" onchange="doSearch('races')"> Show
            excluded</label>
        <label style="margin-left:0.5rem;"><input type="checkbox" id="hide-empty-races" onchange="doSearch('races')"> Hide empty</label>
    </div>
    <div class="table-scroll" style="height:calc(75vh - 300px);max-height:calc(100vh - 250px);overflow-y:auto;resize:vertical;">
        <table>
            <thead>
            <tr id="thead-races"></tr>
            </thead>
            <tbody id="tbody-races"></tbody>
        </table>
    </div>
    <div class="scroll-status" id="scroll-status-races"></div>
    <div id="json-raw-races"></div>

    <div id="merge-bar-races" style="display:none; margin-top:0.75rem; padding:0.6rem 0.8rem; background:#fff8e1; border:1px solid #f0c040; border-radius:4px;">
        <span id="merge-bar-count-races"></span>
        <button id="exclude-btn-races" onclick="showExcludePanel('races', true)" style="margin-left:0.5rem;display:none;">
            Exclude…
        </button>
        <button id="include-btn-races" onclick="showExcludePanel('races', false)" style="margin-left:0.5rem;display:none;">
            Include…
        </button>
        <button id="dubious-btn-races" onclick="showDubiousPanel('races')" style="margin-left:0.5rem;display:none;">Flag as
            dubious…
        </button>
        <button onclick="clearSelection('races')" style="margin-left:0.5rem;">Clear selection</button>
    </div>

    <div id="dubious-panel-races" style="display:none; margin-top:0.75rem; padding:0.8rem; border:1px solid #ccc; border-radius:4px; background:#fafafa;">
        <strong id="dubious-panel-title-races"></strong>
        <div id="dubious-list-races" style="margin:0.6rem 0;"></div>
        <div style="margin-bottom:0.5rem;">
            <label for="dubious-message-races" style="font-size:0.9rem;">Why is this dubious? (optional):</label><br>
            <textarea id="dubious-message-races" rows="2" style="width:100%;max-width:400px;padding:3px 6px;font-size:0.9rem;" placeholder="Reason…"></textarea>
        </div>
        <div style="margin-bottom:0.5rem;">
            <label for="dubious-email-races" style="font-size:0.9rem;">Your email (optional): </label>
            <input type="email" id="dubious-email-races" placeholder="you@example.com" style="padding:3px 6px;" oninput="syncRequestEmail(this.value)">
        </div>
        <button id="dubious-submit-races" onclick="submitDubious('races')">Submit</button>
        <button onclick="hideDubiousPanel('races')" style="margin-left:0.5rem;">Cancel</button>
        <div id="dubious-status-races" style="margin-top:0.5rem; color:#555;"></div>
    </div>

    <div id="exclude-panel-races" style="display:none; margin-top:0.75rem; padding:0.8rem; border:1px solid #ccc; border-radius:4px; background:#fafafa;">
        <strong id="exclude-panel-title-races"></strong>
        <div id="exclude-list-races" style="margin:0.6rem 0;"></div>
        <div id="exclude-email-row-races" style="display:none; margin-bottom:0.5rem;">
            <label for="exclude-email-races" style="font-size:0.9rem;">Your email (optional): </label>
            <input type="email" id="exclude-email-races" placeholder="you@example.com" style="padding:3px 6px;" oninput="syncRequestEmail(this.value)">
        </div>
        <div id="exclude-message-row-races" style="display:none; margin-bottom:0.5rem;">
            <label for="exclude-message-races" style="font-size:0.9rem;">Reason (optional):</label><br>
            <textarea id="exclude-message-races" rows="2" style="width:100%;max-width:400px;padding:3px 6px;font-size:0.9rem;" placeholder="Reason…"></textarea>
        </div>
        <button id="exclude-confirm-races" onclick="performExclude('races')">Confirm</button>
        <button id="exclude-request-confirm-races" onclick="requestExclude('races')" style="display:none;">Submit request
        </button>
        <button onclick="hideExcludePanel('races')" style="margin-left:0.5rem;">Cancel</button>
        <div id="exclude-status-races" style="margin-top:0.5rem; color:#555;"></div>
    </div>

    <div id="division-section-races" style="display:none; margin-top:1rem;">
        <div id="race-series-race-label" style="font-size:1.05rem;font-weight:bold;margin-bottom:0.4rem;"></div>
        <div style="font-weight:bold;margin-bottom:0.25rem;">Division Chart
            <a href="ui-tips.md#chart-division" class="info-btn" data-tip="Bar chart of elapsed and  RF/PF corrected times for each finisher in the selected division against the PF.  Elapsed time line should slope up with higher PF; the corrected time lines should be level if the Factor was correct for this race." target="_blank">ⓘ</a>
        </div>
        <div style="display:flex;gap:1.5rem;align-items:center;margin:0.5rem 0;">
            <label>Division: <select id="race-division-select" onchange="onRaceDivisionChange()"></select></label>
            <span id="race-variant-label" style="font-size:0.9rem;color:#555;"></span>
            <label title="Show the Elapsed time line in the chart"><input type="checkbox" id="race-show-elapsed" checked onchange="onRaceElapsedChange()">
                Elapsed</label>
            <label><input type="checkbox" id="race-show-error-bars" onchange="onRaceErrorBarsChange()"> Error bars</label>
            <label><input type="checkbox" id="race-show-trend" onchange="onRaceTrendChange()"> Trend lines</label>
            <label title="Start the time axis at zero so bar heights are directly comparable">
                <input type="checkbox" id="race-y-from-zero" checked onchange="onDivChartYFromZeroChange(this)"> From 0m
            </label>
            <label title="Start the PF axis at zero">
                <input type="checkbox" id="race-x-from-zero" onchange="onDivChartXFromZeroChange(this)"> From 0.0F
            </label>
            <label title="Show the legend overlaid on the chart">
                <input type="checkbox" id="race-show-legend" onchange="onShowLegendChange(this)"> Legend
            </label>
            <label>X-axis: <select id="race-div-xfactor" onchange="onDivXFactorChange(this)"></select></label>
        </div>
        <div id="race-division-note" style="font-size:0.85rem;color:#888;margin-bottom:0.25rem;"></div>
        <div id="race-division-chart" style="width:100%;height:600px;"></div>
        <div class="division-nav" style="margin-top:0.5rem;">
            <button id="race-prev-btn" onclick="prevRace()" disabled>&#8592; Prev</button>
            <button id="race-next-btn" onclick="nextRace()" disabled>Next &#8594;</button>
            <span id="race-div-title" style="flex:1;text-align:center;font-weight:bold;font-size:1rem;"></span>
        </div>

        <div id="pf-calc" style="display:none; margin-top:1.25rem;">
            <h3 style="margin:0 0 0.5rem;">Handicap Calculator
                <a href="ui-tips.md#table-pf-calc" class="info-btn" data-tip="Enter a handicap for any boat — PF and RF columns for all boats are scaled by ratio. Each column uses its own per-boat ratio. Loaded handicaps are remembered across race selections." target="_blank">ⓘ</a>
            </h3>
            <p style="margin:0 0 0.5rem;color:#666;font-size:0.85rem;">
                All boats from all divisions of the selected race. Loaded handicaps persist while you browse other races.
            </p>
            <table class="pf-calc-table"></table>
            <div style="margin-top:0.5rem;">
                <button id="use-pf-btn" style="padding:4px 12px;" title="Fill empty entries in the focused set with the displayed PF value">
                    Use PF
                </button>
                <button id="use-rf-btn" style="margin-left:0.5rem;padding:4px 12px;" title="Fill empty entries in the focused set with the displayed RF value">
                    Use RF
                </button>
            </div>
            <div id="race-compare-btn-container" style="margin-top:0.5rem;"></div>
            <div id="fetch-handicaps-form" style="margin-top:1rem;padding:0.8rem;border:1px solid #ddd;border-radius:4px;background:#f9f9f9;">
                <div style="margin-bottom:0.8rem;">
                    <label for="handicap-file">Load handicaps from file:</label>
                    <input type="file" id="handicap-file" accept=".json" style="margin-left:0.5rem;">
                    <div id="file-status" style="margin-top:0.5rem;color:#666;font-size:0.9rem;"></div>
                </div>
                <div style="border-top:1px solid #ddd;margin:0.8rem 0;"></div>
                <div style="margin-bottom:0.8rem;">
                    <label for="handicap-variant-mode">On import:</label>
                    <select id="handicap-variant-mode" style="margin-left:0.5rem;" title="How to handle Spin/NS/2H variant info in fetched handicaps">
                        <option value="ignore">Ignore variant</option>
                        <option value="set">Set selectors</option>
                        <option value="filter" selected>Filter by selector</option>
                    </select>
                    <label for="handicap-source-variant" style="margin-left:1rem;">Source variant:</label>
                    <select id="handicap-source-variant" style="margin-left:0.5rem;" title="Override the variant of the imported handicaps (useful when the source doesn't label spin/NS)">
                        <option value="auto" selected>Auto-detect</option>
                        <option value="spin">Spin</option>
                        <option value="nonSpin">Non-Spin</option>
                        <option value="twoHanded">Two-Handed</option>
                    </select>
                </div>
                <div style="border-top:1px solid #ddd;margin:0.8rem 0;"></div>
                <div>
                    <button id="download-handicaps-btn" style="padding:4px 12px;">Download handicaps as JSON</button>
                    <button id="clear-handicaps-btn" style="margin-left:0.5rem;padding:4px 12px;">Clear all</button>
                    <div id="download-status" style="margin-top:0.5rem;color:#666;font-size:0.9rem;"></div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>window.PF_ENTITY = 'races';</script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<script src="common.js"></script>
<script src="handicap-calc.js"></script>
<script src="data.js"></script>
</body>
</html>
