<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <title>PF — Redirecting…</title>
    <script>
        // Legacy redirect: data.html was a single tabbed page. Each entity now has its own
        // top-level page (clubs.html, boats.html, designs.html, series.html, races.html).
        // Translate the old query params:
        //   ?tab=<entity>            → <entity>.html
        //   ?<entity>Id=<X>          → <entity>.html?id=<X>
        (function () {
            const params = new URLSearchParams(location.search);
            const ID_PARAMS = {
                raceId: 'races',
                boatId: 'boats',
                seriesId: 'series',
                clubId: 'clubs',
                designId: 'designs',
            };
            for (const [param, entity] of Object.entries(ID_PARAMS)) {
                const v = params.get(param);
                if (v) {
                    location.replace(entity + '.html?' + new URLSearchParams({id: v}));
                    return;
                }
            }
            const tab = params.get('tab');
            const ENTITIES = ['clubs', 'boats', 'designs', 'series', 'races'];
            const target = ENTITIES.includes(tab) ? tab : 'boats';
            location.replace(target + '.html');
        })();
    </script>
</head>
<body>
<p>Redirecting… <a href="boats.html">Continue to Boats</a></p>
</body>
</html>
